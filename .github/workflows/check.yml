name: Rust and Nix image checks
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: zbm-rs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: cachix/install-nix-action@v31
      - run: cargo fmt --all --check
        working-directory: zbm-rs
      - run: cargo test --workspace --all-features --locked
        working-directory: zbm-rs
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        working-directory: zbm-rs
      - run: nix develop -c uv run --no-project nix/check-config.py
        working-directory: zbm-rs
      - run: nix develop -c uv run --no-project nix/check-runtime-audit.py
        working-directory: zbm-rs
      - run: nix develop -c uv run --no-project nix/check-security-tools.py
        working-directory: zbm-rs
      - run: nix develop -c uv run --offline --no-project python nix/check-nixos-install.py
        working-directory: zbm-rs
      - run: nix build .#checks.x86_64-linux.hardware-probe --out-link result-hardware-probe
        working-directory: zbm-rs
      - run: nix build .#zbm-rs-efi .#checks.x86_64-linux.image-size --out-link result
        working-directory: zbm-rs
      - run: nix build .#checks.x86_64-linux.module-config .#checks.x86_64-linux.config-binary-reuse --out-link result-module-config
        working-directory: zbm-rs
      - run: nix build .#checks.x86_64-linux.module-options --out-link result-module-options
        working-directory: zbm-rs
      - run: nix build .#zbm-rs-efi-test --out-link result-test
        working-directory: zbm-rs
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf util-linux dosfstools mtools
      - run: cargo xtask smoke --run target/vm/ci-lifecycle --tcg --lifecycle --failures
        working-directory: zbm-rs
      - run: nix build .#zbm-rs-efi-test-host-only-scsi --out-link result-scsi
        working-directory: zbm-rs
      - run: cargo xtask smoke --image result-scsi --run target/vm/ci-host-only-scsi --port 2231 --tcg --scsi
        working-directory: zbm-rs
      - run: nix build .#zbm-rs-boot-fixture --out-link result-fixture
        working-directory: zbm-rs
      - run: cargo xtask boot-smoke --image result-test --fixture result-fixture --run target/vm/ci-nixos-boot --tcg
        working-directory: zbm-rs
      - run: nix build .#checks.x86_64-linux.native-nixos --out-link result-native-nixos
        working-directory: zbm-rs
      - run: nix build .#zbm-rs-boot-fixture-specialisations --out-link result-specialisations
        working-directory: zbm-rs
      - run: cargo xtask boot-smoke --specialisation --image result-test --fixture result-specialisations --run target/vm/ci-specialisation-boot --port 2232 --tcg
        working-directory: zbm-rs
      - run: nix build .#zbm-rs-efi-test-snapshot --out-link result-snapshot
        working-directory: zbm-rs
      - run: cargo xtask boot-smoke --snapshot --image result-snapshot --fixture result-fixture --run target/vm/ci-snapshot-boot --tcg
        working-directory: zbm-rs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-sizes-and-vm-evidence
          path: |
            zbm-rs/result/sizes.json
            zbm-rs/result-test/sizes.json
            zbm-rs/target/vm/ci-lifecycle
            zbm-rs/target/vm/ci-specialisation-boot
            zbm-rs/target/vm/ci-nixos-boot
            zbm-rs/target/vm/ci-snapshot-boot
            zbm-rs/target/vm/ci-host-only-scsi
            zbm-rs/result-snapshot/sizes.json
