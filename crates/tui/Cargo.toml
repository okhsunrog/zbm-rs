[package]
name = "zbm-rs"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
libc = "0.2.190"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt", "macros", "sync", "time"] }
zbm-core = { version = "0.1.0", path = "../core" }

[features]
# Disposable image only; production builds have no crash-injection commands.
vm-test = []

[build-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
